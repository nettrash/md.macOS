name: macOS Build & Test

on:
  push:
    # The default branch here is `master` (origin/HEAD -> origin/master), but
    # this workflow triggered only on `main` — a branch that exists and has not
    # moved since 1.0. So every push of real work went untested and the README
    # badge reported a 1.0-era run. Both names are listed, as md.vscode does,
    # so the badge follows the branch the work is actually on.
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-test:
    name: Build and Test
    # The app targets macOS 14, but the source uses the Xcode 26 toolchain
    # (SwiftUI / SDK). macos-26 ships Xcode 26; `macos-latest` may still
    # alias an older Xcode, so we pin.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build & test
        run: |
          xcodebuild test \
            -project md.xcodeproj \
            -scheme md \
            -destination 'platform=macOS' \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: build/TestResults.xcresult
          retention-days: 7
